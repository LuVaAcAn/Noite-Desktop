[package]
name = "proyecto-noche"
version = "1.1.4"
description = "Noite — actividades, planes y recuerdos compartidos"
edition = "2021"
license-file = "../../../LICENSE.txt"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent", "crypto-rust"] }
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
url = "2"
cpal = "0.15"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1.8"
arboard = { version = "3.4", default-features = false }
rand = "0.9"
ed25519-dalek = "2.1"
rfd = "0.15"
symphonia = { version = "0.5.4", default-features = false, features = ["aac", "adpcm", "alac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
kamadak-exif = "0.6"
webp = "0.3"
quick-xml = { version = "0.41", features = ["serialize"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Power", "Win32_System_Threading"] }
windows = { version = "0.62.2", features = ["ApplicationModel", "ApplicationModel_Core", "Management_Deployment", "Storage_Search", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_WinRT", "Win32_UI_Shell"] }
winreg = "0.55"
# 0.18.4 permite mezclar dos ABI de windows-core cuando convive con Tauri
# 2.11; 0.18.3 conserva una única generación y evita el fallo del macro COM.
wmi = "=0.18.3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
