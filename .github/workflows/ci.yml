name: Windows release checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Inspect repository for private files and credentials
        run: node apps/desktop/scripts/audit-repository.mjs
      - name: Verify third-party license inventory
        run: |
          node apps/desktop/scripts/generate-third-party-notices.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- THIRD_PARTY_LICENSES.md
      - name: Audit production JavaScript dependencies
        run: npm audit --audit-level=moderate
      - name: Lint and test frontend
        run: |
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
      - name: Smoke test local onboarding and offline screens
        run: node apps/desktop/scripts/smoke-local.mjs
      - name: Verify Rust formatting
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all --check
      - name: Lint and test Rust
        working-directory: apps/desktop/src-tauri
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked
      - name: Install RustSec auditor
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        working-directory: apps/desktop/src-tauri
        run: cargo audit
      - name: Build unsigned release executable
        shell: pwsh
        run: |
          $separator = [char]0x1f
          $env:CARGO_ENCODED_RUSTFLAGS = @(
            '--remap-path-prefix', "$env:GITHUB_WORKSPACE=.",
            '--remap-path-prefix', "$env:USERPROFILE=<BUILD_USER>"
          ) -join $separator
          npm run tauri -- build --no-bundle -- --locked
      - name: Inspect production artifacts
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./apps/desktop/scripts/audit-release-artifacts.ps1
